name: CI → CD (Invoice Reconciliation System)

on:
  push:
    branches: [main]

jobs:
  # -------------------
  # 1️⃣ CI JOB
  # -------------------
  test:
    name: CI - Run Tests
    runs-on: ubuntu-latest

    env:
      # Dummy key so LLM imports don't crash in CI
      GROQ_API_KEY: "ci_dummy_key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 🔑 CRITICAL FIX (this was missing before)
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Run tests
        run: pytest -v

  # -------------------
  # 2️⃣ CD JOB
  # -------------------
  deploy:
    name: CD - Deploy to Render
    runs-on: ubuntu-latest

    # 🚨 CD runs ONLY if CI passes
    needs: test

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set"
            exit 1
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
